[package]
name = "prl-bench-tools"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone: not a member of the orchestrator workspace.
[workspace]

[dependencies]
axum = "0.8"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
prl-wire = { path = "../../crates/prl-wire" }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
zmq = "0.10"

[profile.release]
debug = 1
