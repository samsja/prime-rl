# Orchestrator-only config: remaining variants (frozen sources, other algorithms, resume.dir, nixl).
batch_size = 8
gc = { interval = 3 }

[model]
name = "Qwen/Qwen3-0.6B"

[renderer]
name = "qwen3"

[resume]
dir = "other/run/checkpoints/step_50"

[weight_broadcast]
type = "nixl"
session_id = "s"
overlap_transfer_and_replay = true

[concurrency]
max_inflight = "None"

[monitors]
file = "None"
prime = "None"

[train.env.interception]
type = "server"
tunnel = { type = "prime" }

[[train.source]]
name = "sft"
env.taskset.id = "reverse-text"
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"
algo.type = "sft"
algo.sampling.source = { name = "teacher", base_url = "http://localhost:8001/v1", api_key_var = "T_KEY" }

[[train.source]]
name = "debug"
env.taskset.id = "reverse-text"
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"
algo = { type = "debug", advantage = 0.5 }

[[train.source]]
name = "rae"
env.taskset.id = "reverse-text"
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"
algo = { type = "rae", decay = 0.9 }

[[train.source]]
name = "maxrl"
env.taskset.id = "reverse-text"
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"
algo = { type = "max_rl" }

[[train.source]]
name = "opd"
env.taskset.id = "reverse-text"
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"
algo = { type = "opd", teacher = { name = "t", base_url = "http://localhost:8002/v1" } }

[[train.source]]
name = "opsd"
env.taskset.id = "reverse-text"
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"
algo = { type = "opsd", demo_key = "answer", renderer = { name = "prime-qwen3" } }

[[train.source]]
name = "ps"
env.id = "proposer-solver"
env.taskset.id = "reverse-text"
algo = { type = "hierarchical_grpo", episode_agents = ["solver"] }
