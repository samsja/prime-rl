# Orchestrator-only config exercising variants no checked-in config uses.
max_steps = 10
batch_size = 16
seq_len = 4096
max_staleness = 2
dispatch_per_minute = 600
env_server_replicas = 2
inference_metrics_roles = ["prefill", "decode"]
collect_inference_metrics = false
constant_trainer_batch_size = false
num_train_workers = 2
pad_to_multiple_of = 2
pad_to_seq_len = true
gc = "None"

[env_vars]
FOO = "bar"

[model]
name = "Qwen/Qwen3-0.6B"
trust_remote_code = true

[model.vlm]
vision_encoder_attr = "model.visual"
language_model_attr = "model.language_model"

[model.client]
base_url = "http://localhost:8000/v1"
admin_base_url = ["http://localhost:8100/v1", "http://localhost:8101/v1"]
skip_model_check = true
wait_for_ready_timeout = 60
headers = { "X-A" = "1" }
headers_from_env = { "X-B" = "B_VAR" }

[model.client.timeout]
connect = 5.0
read = 600.0

[model.client.dynamo]
discovery_url = "http://dynamo:8000"

[tokenizer]
chat_template = "{{ messages }}"

[renderer]
name = "default"
tool_parser = "hermes"

[ckpt]
interval = 5

[resume]
step = 3

[heartbeat]
url = "https://example.invalid/hb"
min_interval = 10.0

[control]
port = 9041

[weight_broadcast]
type = "nccl"
port = 29600
inference_world_size = 4
timeout = 600

[rollout_transport]
type = "filesystem"

[concurrency]
initial_inflight = 32
min_inflight = 16
max_inflight = 256

[log]
level = "debug"
json_logging = true
log_data = true
interval = 5.0

[monitors.wandb]
project = "p"
entity = "e"
name = "wandb-name"
group = "g"
tags = ["a", "b"]
offline = true

[monitors.file]
path = "/abs/metrics.jsonl"
chunk_bytes = 1024
compress = false
float_decimals = "None"

[train]
group_size = 4

[train.env.interception]
type = "static"
servers = [{ tunnel = { type = "custom", url = "http://x:1/", port = 1 } }, { tunnel = { type = "prime" } }]

[train.env.retries]
max_retries = 1
rules = [{ type = "ProviderError", status_code = [429, "5xx"], message = "overload", max_retries = 3 }]

[train.env.timeout]
episode = 600.0

[train.sampling]
temperature = 0.8
top_p = 0.95
top_k = 64
logprobs = 5
max_completion_tokens = 256
extra_body = { min_p = 0.0 }

[train.select]
shuffle = true
seed = 7
skip = 2
limit = 100
include.idx = ["0:50", 60]
exclude.ids = ["a"]

[train.algo]
type = "grpo"
length_weighted_baseline = true
loss_aggregation = "prompt"
length_penalty = { type = "linear-subagent", subagent_token_weight = 0.5 }

[[train.source]]
name = "rt-a"
ratio = 2.0
env.taskset.id = "reverse-text"
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"
serve.address = "tcp://127.0.0.1:5000"
serve.max_concurrent = 64
serve.pool = { type = "static", num_workers = 2 }
curriculum.sampler = { type = "difficulty_pool", seed = 1 }
curriculum.gates = { adv = { type = "advantage_range", reject_min = -0.1, reject_max = 0.1 } }

[[train.source]]
name = "rt-b"
group_size = 8
env.taskset.id = "reverse-text"
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"
algo = { type = "echo", loss_aggregation = "prompt", roles = { user = { alpha = 0.2 }, tool = {} }, filter = { import_path = "m.f", kwargs = { x = 1 } } }
curriculum.sampler = { type = "standard" }

[eval]
interval = 5
skip_first_step = true
retrigger_on_resume = true
group_size = 2

[eval.sampling]
temperature = 0.6
max_completion_tokens = 64
min_p = 0.05

[[eval.source]]
name = "rt-eval"
interval = 2
env.taskset.id = "reverse-text"
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"
sampling = { top_k = 20, reasoning_effort = "low" }

[[eval.source]]
name = "rt-eval-2"
env.taskset.id = "reverse-text"
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"
