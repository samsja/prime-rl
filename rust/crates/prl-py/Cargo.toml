[package]
name = "prl-py"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "prime_rl_orch_rs"
crate-type = ["cdylib"]

[features]
# Enabled by maturin; off in plain cargo builds, where other crates' tests embed Python.
extension-module = ["pyo3/extension-module"]

[dependencies]
prl-config = { workspace = true }
prl-core = { workspace = true }
prl-eval = { workspace = true }
prl-io = { workspace = true }
prl-monitors = { workspace = true }
prl-types = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
pyo3 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
