[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-stream = { version = "0.1", features = ["sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_bytes = "0.11"
rmp-serde = "1"
rmpv = { version = "1", features = ["with-serde"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
axum = "0.8"
futures = "0.3"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
async-trait = "0.1"
zeromq = "0.4"
pyo3 = { version = "0.25", features = ["abi3-py312"] }

prl-config = { path = "crates/prl-config" }
prl-wire = { path = "crates/prl-wire" }
prl-types = { path = "crates/prl-types" }
prl-train = { path = "crates/prl-train" }
prl-io = { path = "crates/prl-io" }
prl-monitors = { path = "crates/prl-monitors" }
prl-core = { path = "crates/prl-core" }
prl-eval = { path = "crates/prl-eval" }

[profile.release]
debug = 1
