[project]
name = "prime-rl-orch-rs"
version = "0.1.0"
description = "Rust orchestrator backend for prime-rl (pyo3 extension module)."
readme = "README.md"
requires-python = "~=3.12.0"
dependencies = []

[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "../../rust/crates/prl-py/Cargo.toml"
module-name = "prime_rl_orch_rs"
features = ["extension-module"]
profile = "release"

[tool.uv]
# Rebuild the extension when any Rust source in the workspace changes.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "../../rust/Cargo.toml" },
    { file = "../../rust/Cargo.lock" },
    { file = "../../rust/crates/**/Cargo.toml" },
    { file = "../../rust/crates/**/*.rs" },
]
